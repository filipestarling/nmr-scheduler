name: Aldeia — depoimentos da Play Store

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 19h BRT · 1 depoimento por dia no @aldeianaomono (09 a 17/10/2026)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # grava o status de volta no agenda.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publicar o depoimento do dia
        env:
          ALDEIA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.ALDEIA_INSTAGRAM_ACCESS_TOKEN }}
          ALDEIA_INSTAGRAM_USER_ID: ${{ secrets.ALDEIA_INSTAGRAM_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node aldeia-depoimentos/publish.mjs
      - name: Salvar status
        if: always()
        run: |
          git config user.name "Aldeia Scheduler"
          git config user.email "noreply@aldeianaomono.com.br"
          git add aldeia-depoimentos/agenda.json
          git diff --staged --quiet || git commit -m "aldeia-depoimentos: atualiza status [skip ci]"
          git pull --rebase -q && git push
